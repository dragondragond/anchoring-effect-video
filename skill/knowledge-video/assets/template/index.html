<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Studio</title>
<style>
  html, body { margin: 0; background: #000; color: #bbb; font: 13px Menlo, monospace; }
  #c { display: block; width: min(100vw, calc((100vh - 44px) * 16 / 9)); margin: 0 auto; }
  #ui { display: flex; gap: 12px; align-items: center; padding: 10px 16px; }
  #seek { flex: 1; }
  button { background: #222; color: #ddd; border: 1px solid #444; padding: 4px 12px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui"><button id="play">▶ / ❚❚</button><input id="seek" type="range" min="0" step="0.01"><span id="time"></span></div>
<script src="src/music.js"></script>
<script src="src/engine.js"></script>
<script src="src/data.js"></script>
<script src="src/components.js"></script>
<script src="src/overlay.js"></script>
<script src="src/scenes.js"></script>
<script src="src/main.js"></script>
</body>
</html>
